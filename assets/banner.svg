<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0d1124" />
      <stop offset="100%" stop-color="#060814" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
      <circle cx="40" cy="40" r="1" fill="rgba(56, 189, 248, 0.25)" />
    </pattern>

    <!-- Drop Shadow Filters -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .dynamic-pulse {
      animation: pulse 4s ease-in-out infinite alternate;
    }
    .dynamic-orbit {
      animation: rotateRing 20s linear infinite;
      transform-origin: 1040px 210px;
    }
    .dynamic-scan {
      animation: scanBeam 5s ease-in-out infinite alternate;
    }
    .dynamic-wave {
      animation: waveFloat 6s ease-in-out infinite alternate;
    }
    .pill-float-1 {
      animation: floatPill1 5s ease-in-out infinite alternate;
    }
    .pill-float-2 {
      animation: floatPill2 6s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      0% { opacity: 0.3; transform: scale(0.98); }
      100% { opacity: 0.7; transform: scale(1.02); }
    }
    @keyframes rotateRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes scanBeam {
      0% { transform: translateY(0px); opacity: 0.2; }
      50% { opacity: 0.6; }
      100% { transform: translateY(220px); opacity: 0.2; }
    }
    @keyframes waveFloat {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    @keyframes floatPill1 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-6px); }
    }
    @keyframes floatPill2 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(6px); }
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle cx="200" cy="120" r="180" fill="url(#glowGrad1)" class="dynamic-pulse" />
  <circle cx="1020" cy="220" r="220" fill="url(#glowGrad2)" class="dynamic-pulse" style="animation-delay: -2s;" />

  <!-- Animated Sensor Grid / Vision Laser lines on right side -->
  <g opacity="0.6">
    <!-- Robotic Vision Sensor Rings -->
    <circle cx="1040" cy="210" r="140" fill="none" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1.5" stroke-dasharray="8 6" class="dynamic-orbit" />
    <circle cx="1040" cy="210" r="100" fill="none" stroke="rgba(192, 132, 252, 0.25)" stroke-width="1.5" stroke-dasharray="12 8" class="dynamic-orbit" style="animation-direction: reverse; animation-duration: 15s;" />
    <circle cx="1040" cy="210" r="60" fill="rgba(14, 165, 233, 0.08)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
    
    <!-- Central Vision Target / Reticle -->
    <path d="M 1040 140 L 1040 170 M 1040 250 L 1040 280 M 970 210 L 1000 210 M 1080 210 L 1110 210" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <circle cx="1040" cy="210" r="6" fill="#38bdf8" filter="url(#glowFilter)" />

    <!-- 6-DoF Action Vectors -->
    <line x1="1040" y1="210" x2="1120" y2="150" stroke="#c084fc" stroke-width="2" stroke-dasharray="4 3" />
    <circle cx="1120" cy="150" r="4" fill="#c084fc" />
    <text x="1130" y="154" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Action (x,y,z,r,p,y)</text>

    <line x1="1040" y1="210" x2="960" y2="280" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 3" />
    <circle cx="960" cy="280" r="4" fill="#38bdf8" />
    <text x="880" y="295" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Depth / 3D Pose</text>

    <!-- Scanning Line Effect -->
    <g class="dynamic-scan">
      <line x1="880" y1="90" x2="1190" y2="90" stroke="url(#primaryGrad)" stroke-width="1.5" opacity="0.7" />
    </g>
  </g>

  <!-- Left Content Area (Ensuring Title and Subtitle are firmly in foreground) -->
  <g transform="translate(80, 0)">
    
    <!-- Top Category Tag / Badge -->
    <g transform="translate(0, 68)" class="dynamic-wave">
      <rect x="0" y="0" width="280" height="30" rx="15" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1" />
      <circle cx="15" cy="15" r="4" fill="#38bdf8" filter="url(#glowFilter)" />
      <text x="28" y="20" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">CURATED PHYSICAL AI &amp; ROBOTICS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Embodied AI &amp; Robotics
    </text>
    <text x="0" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="44" font-weight="800" fill="url(#primaryGrad)" letter-spacing="-0.5">
      Vision Agents
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="244" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      Vision-Language-Action (VLA) Foundation Models • 6-DoF Perception • Humanoid Manipulation
    </text>
    <text x="0" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#64748b">
      Tracking Top Commercial Platforms &amp; Open-Source Repositories for Next-Gen Physical Autonomy
    </text>

    <!-- Dynamic Feature Interactive Pills -->
    <g transform="translate(0, 315)">
      <!-- Pill 1: VLA Policies -->
      <g class="pill-float-1">
        <rect x="0" y="0" width="170" height="42" rx="10" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <circle cx="22" cy="21" r="5" fill="#38bdf8" />
        <text x="36" y="21" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">OpenVLA &amp; π₀ / OpenPI</text>
        <text x="36" y="33" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5">Generalist Policies</text>
      </g>

      <!-- Pill 2: LeRobot & Gym -->
      <g transform="translate(185, 0)" class="pill-float-2">
        <rect x="0" y="0" width="180" height="42" rx="10" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <circle cx="22" cy="21" r="5" fill="#818cf8" />
        <text x="36" y="21" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🤗 LeRobot &amp; MuJoCo</text>
        <text x="36" y="33" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5">Sim-to-Real Learning</text>
      </g>

      <!-- Pill 3: Perception & FoundationPose -->
      <g transform="translate(380, 0)" class="pill-float-1" style="animation-delay: -1.5s;">
        <rect x="0" y="0" width="195" height="42" rx="10" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <circle cx="22" cy="21" r="5" fill="#c084fc" />
        <text x="36" y="21" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">FoundationPose &amp; SAM-2</text>
        <text x="36" y="33" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5">6-DoF &amp; Zero-Shot Vision</text>
      </g>

      <!-- Pill 4: Commercial Humans & Fleet -->
      <g transform="translate(590, 0)" class="pill-float-2" style="animation-delay: -2.5s;">
        <rect x="0" y="0" width="175" height="42" rx="10" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
        <circle cx="22" cy="21" r="5" fill="#34d399" />
        <text x="36" y="21" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Figure AI &amp; Skild AI</text>
        <text x="36" y="33" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5">Commercial Humanoids</text>
      </g>
    </g>
  </g>

  <!-- Modern Border Framing -->
  <rect x="1" y="1" width="1198" height="418" rx="8" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />
</svg>
